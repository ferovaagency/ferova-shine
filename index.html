    <!--
      THESIS: La capacidad se entiende como un sistema de entrega, no como un catálogo de servicios; se rechaza el hero genérico con cuadrícula de tarjetas.
      OWN-WORLD: Consola física de grafito, vino, marfil y oro donde un brief entra, la capacidad se activa y una entrega documentada sale.
      STORY: Promesa directa → capacidades conectadas → flujo de contratación → evidencia operativa → preguntas → cotización.
      FIRST VIEWPORT: Titular inequívoco, una acción principal y consola 3D con lectura de entrada, activación y salida.
      FORM: Agency Delivery Console, dirección asignada 7, seed 87a80b36.
      FINISH: Revisado en escritorio a 1440px y en móvil emulado a 390px; contraste, foco, desbordamiento y movimiento reducido verificados.
    -->
    <!--
      root se deja vacio a proposito: vite-prerender-plugin inserta el HTML de cada
      ruta anteponiendo el contenido real sin vaciar lo que ya hubiera dentro de root.
      Si este div trae contenido estatico de fabrica, ese contenido queda duplicado
      (con su propio encabezado generico) debajo del contenido real en las paginas
      prerenderizadas. El fallback para bots o usuarios sin JS vive ahora fuera de
      root, en el bloque noscript de abajo, donde no puede duplicarse.
    -->
    <div id="root"></div>
    <noscript>
      <header>
        <a href="/" aria-label="Ferova Agency — Inicio">Ferova Agency</a>
        <nav aria-label="Navegación principal">
          <a href="/servicios">Servicios</a>
          <a href="/servicios/seo-ecommerce">SEO E-commerce</a>
          <a href="/casos-de-exito">Casos de éxito</a>
          <a href="/blog">Blog</a>
          <a href="/contacto">Contacto</a>
        </nav>
      </header>
      <main>
        <!-- Fallback sin JS. Encabezado como parrafo en negrita a proposito: el
             HTML prerenderizado dentro de #root ya aporta el unico encabezado
             principal real de cada ruta; un segundo encabezado principal aqui
             duplicaria el H1 en el HTML crudo (regla del plan SEO: un solo H1). -->
        <p><strong>SEO para Agencias by Ferova — capacidad técnica white label</strong></p>
        <p>
          Capacidad especializada para agencias en <strong>SEO técnico</strong>, <strong>mantenimiento web mensual</strong>,
          <strong>landing pages</strong> y <strong>migraciones SEO</strong>, bajo la marca de la agencia o como especialista visible.
        </p>
        <p>
          La contratación puede ser por tarea, bolsa de horas o capacidad mensual, con alcance, confidencialidad,
          responsables, precio y cronograma definidos antes de empezar.
        </p>
        <p>
          <a href="/contacto">Cotizar horas o tareas</a> · <a href="/precios">Comparar modalidades</a>
        </p>
        <p>
          Esta web requiere JavaScript habilitado para una experiencia interactiva completa. El contenido principal
          sigue siendo accesible arriba.
        </p>
      </main>
    </noscript>
