  <body>
    <!--
      root se deja vacio a proposito: vite-prerender-plugin inserta el HTML de cada
      ruta anteponiendo el contenido real sin vaciar lo que ya hubiera dentro de root.
      Si este div trae contenido estatico de fabrica, ese contenido queda duplicado
      (con su propio encabezado generico) debajo del contenido real en las paginas
      prerenderizadas. El fallback para bots o usuarios sin JS vive ahora fuera de
      root, en el bloque noscript de abajo, donde no puede duplicarse.
    -->
    <div id="root"></div>
    <noscript>
      <header>

      <main>

        <p><strong>Ferova Shine — Web Apps de Alto Rendimiento e Inteligencia Artificial</strong></p>
